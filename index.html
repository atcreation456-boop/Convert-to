<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert to | Smart File Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>
    <div class="bg-orb orb-3" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Convert to</span>
      </div>
      <nav class="header-actions">
        <button class="ghost-btn">Login</button>
        <button class="solid-btn">Sign up</button>
      </nav>
    </header>

    <main class="hero-card">
      <p class="tag">Fast • Secure • Beautiful</p>
      <h1>Convert your files in seconds.</h1>
      <p class="subtitle">
        PDF, Word, PowerPoint, JPG, PNG aur bohat se formats ko ek click mein convert
        karein — bilkul simple aur attractive experience ke saath.
      </p>

      <div class="upload-wrap">
        <button id="uploadButton" class="upload-btn">Select file</button>
        <input id="fileInput" type="file" hidden />
        <p id="fileName" class="file-name">No file selected</p>
      </div>

      <div class="convert-grid">
        <button class="convert-chip active">To PDF</button>
        <button class="convert-chip">PDF to Word</button>
        <button class="convert-chip">PDF to JPG</button>
        <button class="convert-chip">JPG to PDF</button>
        <button class="convert-chip">Word to PDF</button>
        <button class="convert-chip">PPT to PDF</button>
      </div>
    </main>

    <footer class="site-footer">© 2026 Convert to. All rights reserved.</footer>

    <script src="script.js"></script>
  </body>
</html>
